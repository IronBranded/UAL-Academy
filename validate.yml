name: Validate content

on:
  push:
    paths: ['data/**', 'scripts/**', '.github/workflows/validate.yml']
  pull_request:
    paths: ['data/**', 'scripts/**']
  schedule:
    # Weekly, so staleness warnings surface on their own rather than waiting
    # for someone to touch a file. Microsoft changes this surface without notice.
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate category content
        run: node scripts/validate.mjs

  staleness:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Report stale claims
        run: node scripts/validate.mjs --strict
        continue-on-error: true
